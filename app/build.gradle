plugins { id 'com.android.application' }
android {
    namespace 'local.contactbridge'
    compileSdk 37
    defaultConfig {
        applicationId 'local.contactbridge'
        minSdk 30
        targetSdk 37
        versionCode 4
        versionName '0.1.3'
    }
    buildTypes {
        release {
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
